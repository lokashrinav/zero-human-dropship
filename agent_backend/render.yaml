services:
  - type: web
    name: agent-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CJ_API_KEY
        sync: false
      - key: CJ_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: BAND_API_KEY
        sync: false
      - key: BAND_ROOM_ID
        sync: false
      - key: TERAC_API_KEY
        sync: false
      - key: PIONEER_API_KEY
        sync: false
      - key: PIONEER_BASE_URL
        sync: false
      - key: STORE_URL
        sync: false
