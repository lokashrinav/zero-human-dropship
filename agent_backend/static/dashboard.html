<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero Human Dropship — Mission Control</title>
<style>
  :root {
    --bg: #0a0e14; --panel: #111722; --panel2: #0d1320; --border: #1e2836;
    --text: #d8e1ee; --dim: #6b7a90; --accent: #3ddc84; --accent2: #4da3ff;
    --ceo: #ffb454; --sourcing: #4da3ff; --growth: #f472b6; --ops: #3ddc84; --analyst: #c084fc; --other: #8899aa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
  .mono { font-family: 'Cascadia Code', 'Consolas', monospace; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px; border-bottom: 1px solid var(--border); background: var(--panel2);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; box-shadow: 0 0 8px var(--accent); } 50% { opacity: .4; box-shadow: none; } }
  .brand h1 { font-size: 17px; font-weight: 600; letter-spacing: .4px; }
  .brand .sub { font-size: 11px; color: var(--dim); letter-spacing: 1.5px; text-transform: uppercase; }

  .headline { display: flex; gap: 36px; align-items: baseline; }
  .stat { text-align: right; }
  .stat .value { font-size: 34px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; transition: transform .3s; }
  .stat .value.bump { transform: scale(1.15); }
  .stat .value.blue { color: var(--accent2); font-size: 26px; }
  .stat .label { font-size: 10px; color: var(--dim); letter-spacing: 1.5px; text-transform: uppercase; }

  main { display: grid; grid-template-columns: 1fr 380px; gap: 18px; padding: 18px 28px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .panel h2 {
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim);
    padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
  }
  .panel h2 .count { color: var(--accent2); }

  /* Catalog */
  .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; padding: 14px; }
  .product { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; transition: border-color .2s; }
  .product:hover { border-color: var(--accent2); }
  .product img { width: 100%; height: 130px; object-fit: cover; background: #060a10; display: block; }
  .product .noimg { width: 100%; height: 130px; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 30px; background: #060a10; }
  .product .info { padding: 10px 12px; }
  .product .name { font-size: 13px; font-weight: 600; line-height: 1.3; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 34px; }
  .product .pricing { display: flex; justify-content: space-between; align-items: center; }
  .product .price { font-size: 16px; font-weight: 700; color: var(--accent); }
  .product .margin { font-size: 10px; color: var(--dim); background: var(--border); padding: 2px 7px; border-radius: 10px; }
  .product .sold { font-size: 10px; color: var(--ceo); }

  /* Activity feed */
  .feed { max-height: 72vh; overflow-y: auto; }
  .entry { padding: 10px 16px; border-bottom: 1px solid var(--panel2); display: flex; gap: 10px; animation: fadein .4s; }
  @keyframes fadein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; } }
  .entry .time { font-size: 10px; color: var(--dim); white-space: nowrap; padding-top: 3px; }
  .entry .agent { font-size: 11px; font-weight: 700; white-space: nowrap; padding-top: 2px; }
  .entry .msg { font-size: 12px; color: var(--text); line-height: 1.45; word-break: break-word; }
  .empty { padding: 30px; text-align: center; color: var(--dim); font-size: 13px; }

  /* Agent status row */
  .agents { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 14px; }
  @media (max-width: 700px) { .agents { grid-template-columns: repeat(2, 1fr); } }
  .agent-card { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .agent-card .aname { font-size: 12px; font-weight: 700; margin-bottom: 3px; }
  .agent-card .astat { font-size: 10px; color: var(--dim); }
  .agent-card.active { border-color: var(--accent); }
  .agent-card.active .astat { color: var(--accent); }

  footer { text-align: center; color: var(--dim); font-size: 10px; padding: 14px; letter-spacing: 1px; }
  .col { display: flex; flex-direction: column; gap: 18px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="dot"></div>
    <div>
      <h1>ZERO HUMAN DROPSHIP</h1>
      <div class="sub">autonomous business &middot; mission control</div>
    </div>
  </div>
  <div class="headline">
    <div class="stat"><div class="value blue" id="orders">0</div><div class="label">Orders</div></div>
    <div class="stat"><div class="value" id="revenue">$0.00</div><div class="label">Revenue (24h)</div></div>
  </div>
</header>

<main>
  <div class="col">
    <div class="panel">
      <h2>Agent Staff</h2>
      <div class="agents" id="agents"></div>
    </div>
    <div class="panel">
      <h2>Live Catalog <span class="count" id="pcount"></span></h2>
      <div class="products" id="products"><div class="empty">Waiting for the sourcing agent…</div></div>
    </div>
  </div>
  <div class="panel">
    <h2>Decision Feed <span class="count mono" id="dcount"></span></h2>
    <div class="feed" id="feed"><div class="empty">No decisions yet — the CEO is waking up…</div></div>
  </div>
</main>

<footer>OPERATED ENTIRELY BY AI AGENTS &middot; HUMANS WATCHING ONLY</footer>

<script>
const AGENT_COLORS = { CEO: 'var(--ceo)', SourcingAgent: 'var(--sourcing)', GrowthAgent: 'var(--growth)', OpsAgent: 'var(--ops)', AnalystAgent: 'var(--analyst)' };
const AGENT_ROLES = { CEO: 'strategy & pricing', SourcingAgent: 'product discovery', GrowthAgent: 'marketing & listings', OpsAgent: 'fulfillment', AnalystAgent: 'customer research' };
const color = a => AGENT_COLORS[a] || 'var(--other)';
let lastRevenue = -1;

async function poll() {
  try {
    const [stats, products, decisions] = await Promise.all([
      fetch('/api/stats').then(r => r.json()),
      fetch('/api/products').then(r => r.json()).catch(() => []),
      fetch('/api/decisions?limit=80').then(r => r.json()).catch(() => []),
    ]);
    renderStats(stats);
    renderProducts(Array.isArray(products) ? products : [], stats);
    renderFeed(Array.isArray(decisions) ? decisions : []);
    renderAgents(Array.isArray(decisions) ? decisions : []);
  } catch (e) { /* backend restarting; keep last view */ }
}

function renderStats(s) {
  const rev = (s.gross_revenue_cents || 0) / 100;
  const el = document.getElementById('revenue');
  el.textContent = '$' + rev.toFixed(2);
  if (lastRevenue >= 0 && rev > lastRevenue) { el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 400); }
  lastRevenue = rev;
  document.getElementById('orders').textContent = s.orders || 0;
}

function renderProducts(products, stats) {
  const el = document.getElementById('products');
  document.getElementById('pcount').textContent = products.length ? products.length + ' live' : '';
  if (!products.length) { el.innerHTML = '<div class="empty">Waiting for the sourcing agent…</div>'; return; }
  const soldBy = {};
  (stats.by_product || []).forEach(m => soldBy[m.product_id] = m);
  el.innerHTML = products.map(p => {
    const price = (p.price_cents || 0) / 100, cost = (p.cost_cents || 0) / 100;
    const margin = price > 0 ? Math.round((1 - cost / price) * 100) : 0;
    const sold = soldBy[p.product_id];
    const img = (p.images && p.images[0])
      ? `<img src="${esc(p.images[0])}" loading="lazy" onerror="this.outerHTML='<div class=noimg>📦</div>'">`
      : '<div class="noimg">📦</div>';
    return `<div class="product">${img}<div class="info">
      <div class="name">${esc(p.name || 'Unnamed')}</div>
      <div class="pricing"><span class="price">$${price.toFixed(2)}</span>
      ${sold ? `<span class="sold">${sold.units} sold</span>` : `<span class="margin">${margin}% margin</span>`}</div>
    </div></div>`;
  }).join('');
}

function renderFeed(entries) {
  const el = document.getElementById('feed');
  document.getElementById('dcount').textContent = entries.length || '';
  if (!entries.length) { el.innerHTML = '<div class="empty">No decisions yet — the CEO is waking up…</div>'; return; }
  el.innerHTML = entries.slice().reverse().map(e => `
    <div class="entry">
      <span class="time mono">${esc(e.time || '')}</span>
      <span class="agent" style="color:${color(e.agent)}">${esc(e.agent || '?')}</span>
      <span class="msg">${esc(String(e.message || '').slice(0, 400))}</span>
    </div>`).join('');
}

function renderAgents(entries) {
  const lastSeen = {};
  entries.forEach(e => { if (e.agent) lastSeen[e.agent] = e.ts; });
  const now = Date.now() / 1000;
  document.getElementById('agents').innerHTML = Object.keys(AGENT_ROLES).map(a => {
    const seen = lastSeen[a];
    const active = seen && (now - seen) < 1200;
    const status = seen ? (active ? 'active' : ago(now - seen) + ' ago') : 'standing by';
    return `<div class="agent-card${active ? ' active' : ''}">
      <div class="aname" style="color:${color(a)}">${a.replace('Agent','')}</div>
      <div class="astat">${AGENT_ROLES[a]}<br>${status}</div></div>`;
  }).join('');
}

const ago = s => s < 3600 ? Math.round(s / 60) + 'm' : Math.round(s / 3600) + 'h';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

poll();
setInterval(poll, 4000);
</script>
</body>
</html>
