services:
  - type: web
    name: zero-human-backend
    runtime: python
    rootDir: agent_backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TERAC_API_KEY
        sync: false
      - key: PIONEER_API_KEY
        sync: false
      - key: PIONEER_BASE_URL
        value: https://api.pioneer.ai/v1
      - key: LINQ_API_KEY
        sync: false
      - key: SOLARI_API_KEY
        sync: false
      - key: STORE_CATALOG_URL
        value: https://storefront-omega-three.vercel.app/api/catalog
